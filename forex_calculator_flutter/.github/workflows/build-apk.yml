name: Build Flutter APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        working-directory: forex_calculator_flutter
        run: flutter create --platforms=android .

      - name: Get dependencies
        working-directory: forex_calculator_flutter
        run: flutter pub get

      - name: Build APK
        working-directory: forex_calculator_flutter
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: forex-calculator-apk
          path: forex_calculator_flutter/build/app/outputs/flutter-apk/app-release.apk
